[project]
name = "pharma-assignment"
version = "0.1.0"
description = "Evidence-based research assistant for the supplied pharmacology corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.1",
    "langgraph==1.1.8",
    "numpy==2.2.6",
    "openai==1.109.1",
    "pydantic==2.11.7",
    "python-dotenv==1.0.0",
    "uvicorn==0.40.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.0.2", "ruff==0.14.14"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
